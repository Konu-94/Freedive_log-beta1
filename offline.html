<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiveLog - 오프라인</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<meta name="theme-color" content="#3182F6">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #F7F8FA; color: #191F28;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center; line-height: 1.5;
  }
  .box { max-width: 320px; }
  img { width: 88px; height: 88px; margin-bottom: 24px; opacity: .35; }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  p { font-size: 15px; color: #8B95A1; margin-bottom: 28px; }
  button {
    width: 100%; padding: 16px; border: none; border-radius: 12px;
    background: #3182F6; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="box">
    <img src="icon-192.png" alt="">
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>DiveLog는 기록을 불러오려면 인터넷 연결이 필요합니다. 연결 상태를 확인한 뒤 다시 시도해 주세요.</p>
    <button onclick="location.replace('./')">다시 시도</button>
  </div>
  <script>
    // 연결이 돌아오면 자동으로 앱으로 복귀
    window.addEventListener('online', () => location.replace('./'));
  </script>
</body>
</html>
